name: Check controlled refund and heartbeat

on:
  push:
    branches:
      - main
      - feature/refund-heartbeat-hardening
      - test/network-resilience-multiclient
  pull_request:
    paths:
      - .github/workflows/check-refund-heartbeat.yml
      - database/migrations/**
      - src/NetCafeManager.Infrastructure/Persistence/**
      - src/NetCafeManager.Server/Billing/**
      - src/NetCafeManager.Server/Machines/**
      - src/NetCafeManager.Server/Networking/**
      - src/NetCafeManager.Client/Networking/**
      - src/NetCafeManager.Client/MainForm.cs
      - src/NetCafeManager.Shared/Billing/**
      - src/NetCafeManager.Shared/Networking/**
      - src/NetCafeManager.Shared/Sessions/**
      - tests/NetCafeManager.RefundSmoke/**
      - tests/NetCafeManager.NetworkIntegrationSmoke/**
      - tests/NetCafeManager.NetworkResilienceSmoke/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build NetCafeManager.sln --configuration Release -p:BuildInParallel=false
      - run: dotnet build tests/NetCafeManager.RefundSmoke --configuration Release
      - run: dotnet build tests/NetCafeManager.NetworkIntegrationSmoke --configuration Release

  network-resilience:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/NetCafeManager.NetworkResilienceSmoke --configuration Release

  sql-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)Aa1!"
          printf 'MSSQL_SA_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
          printf '::add-mask::%s\n' "$password"
      - shell: bash
        run: |
          set -euo pipefail
          export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
          container_id="$(docker run --rm -d -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD -p 127.0.0.1::1433 mcr.microsoft.com/mssql/server:2022-latest)"
          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT
          sql() {
            docker exec -i -e SQLCMDPASSWORD "$container_id" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 2 "$@"
          }
          ready=false
          for attempt in {1..45}; do
            if sql -Q 'SELECT 1' </dev/null >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo 'SQL Server did not become ready.' >&2
            exit 1
          fi
          sql -Q 'CREATE DATABASE [NetCafeManager_CI];' </dev/null
          for migration in database/migrations/*.sql; do
            sql -d NetCafeManager_CI < "$migration"
          done
          endpoint="$(docker port "$container_id" 1433/tcp)"
          port="${endpoint##*:}"
          connection="Server=127.0.0.1,${port};Database=NetCafeManager_CI;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
          export NETCAFE_REFUND_SMOKE_CONNECTION="$connection"
          export NETCAFE_NETWORK_SMOKE_CONNECTION="$connection"
          dotnet run --project tests/NetCafeManager.RefundSmoke --configuration Release
          dotnet run --project tests/NetCafeManager.NetworkIntegrationSmoke --configuration Release
