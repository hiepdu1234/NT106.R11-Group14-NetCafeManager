name: Build database foundation

on:
  push:
    branches:
      - feature/database-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore NetCafeManager.sln

      - name: Build solution
        run: dotnet build NetCafeManager.sln --configuration Release --no-restore

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.33

      - name: Validate EF model with temporary migration
        run: dotnet ef migrations add CiModelSmoke --project src/NetCafeManager.Infrastructure --startup-project src/NetCafeManager.Infrastructure --output-dir Persistence/Migrations

      - name: Generate migration SQL without connecting to database
        run: dotnet ef migrations script --project src/NetCafeManager.Infrastructure --startup-project src/NetCafeManager.Infrastructure --output ci-migration.sql

      - name: Build generated migration
        run: dotnet build NetCafeManager.sln --configuration Release --no-restore
