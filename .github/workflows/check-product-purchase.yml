name: Check product purchase hardening

on:
  push:
    paths:
      - .github/workflows/check-product-purchase.yml
      - database/migrations/001_initial_schema.sql
      - database/migrations/002_business_data_hardening.sql
      - database/migrations/003_prepaid_invoice_policy.sql
      - database/migrations/004_balance_refund.sql
      - database/migrations/005_product_purchase_idempotency.sql
      - database/seed/001_seed_core.sql
      - src/NetCafeManager.Infrastructure/Persistence/**
      - src/NetCafeManager.Server/Inventory/**
      - src/NetCafeManager.Shared/Inventory/**
      - tests/NetCafeManager.InventorySmoke/**
      - tests/NetCafeManager.ProductPurchaseSmoke/**

  pull_request:
    paths:
      - .github/workflows/check-product-purchase.yml
      - database/migrations/001_initial_schema.sql
      - database/migrations/002_business_data_hardening.sql
      - database/migrations/003_prepaid_invoice_policy.sql
      - database/migrations/004_balance_refund.sql
      - database/migrations/005_product_purchase_idempotency.sql
      - database/seed/001_seed_core.sql
      - src/NetCafeManager.Infrastructure/Persistence/**
      - src/NetCafeManager.Server/Inventory/**
      - src/NetCafeManager.Shared/Inventory/**
      - tests/NetCafeManager.InventorySmoke/**
      - tests/NetCafeManager.ProductPurchaseSmoke/**

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build purchase and inventory tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        run: dotnet build NetCafeManager.sln --configuration Release -p:BuildInParallel=false

      - name: Build inventory smoke tests
        run: dotnet build tests/NetCafeManager.InventorySmoke --configuration Release -p:BuildInParallel=false

      - name: Build purchase smoke tests
        run: dotnet build tests/NetCafeManager.ProductPurchaseSmoke --configuration Release -p:BuildInParallel=false

  purchase-smoke:
    name: Run purchase and inventory integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Start SQL Server and run tests
        shell: bash
        run: |
          set -euo pipefail

          export MSSQL_SA_PASSWORD="Aa9!$(openssl rand -hex 24)"
          printf '::add-mask::%s\n' "$MSSQL_SA_PASSWORD"
          export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"

          container_id="$(docker run --rm -d \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD \
            -p 127.0.0.1::1433 \
            mcr.microsoft.com/mssql/server:2022-latest)"

          trap 'docker stop "$container_id" >/dev/null 2>&1 || true' EXIT

          sql() {
            docker exec -i -e SQLCMDPASSWORD "$container_id" \
              /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -C -b -l 2 "$@"
          }

          ready=false

          for attempt in {1..45}; do
            if sql -Q 'SELECT 1' </dev/null >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done

          if [[ "$ready" != true ]]; then
            echo "SQL Server did not become ready." >&2
            exit 1
          fi

          sql -Q 'CREATE DATABASE [NetCafeManager_CI];' </dev/null

          echo "Applying migration 001..."
          sql -d NetCafeManager_CI < database/migrations/001_initial_schema.sql

          echo "Applying migration 002..."
          sql -d NetCafeManager_CI < database/migrations/002_business_data_hardening.sql

          echo "Applying migration 003..."
          sql -d NetCafeManager_CI < database/migrations/003_prepaid_invoice_policy.sql

          echo "Applying migration 004..."
          sql -d NetCafeManager_CI < database/migrations/004_balance_refund.sql

          echo "Applying migration 005..."
          sql -d NetCafeManager_CI < database/migrations/005_product_purchase_idempotency.sql

          echo "Applying seed data..."
          sql -d NetCafeManager_CI < database/seed/001_seed_core.sql

          endpoint="$(docker port "$container_id" 1433/tcp)"
          port="${endpoint##*:}"

          export NETCAFE_INVENTORY_SMOKE_CONNECTION="Server=127.0.0.1,${port};Database=NetCafeManager_CI;User ID=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"

          export NETCAFE_PURCHASE_SMOKE_CONNECTION="$NETCAFE_INVENTORY_SMOKE_CONNECTION"

          echo "Running inventory smoke tests..."
          dotnet run --project tests/NetCafeManager.InventorySmoke --configuration Release

          echo "Running product purchase smoke tests..."
          dotnet run --project tests/NetCafeManager.ProductPurchaseSmoke --configuration Release

          echo "All purchase and inventory tests passed."

